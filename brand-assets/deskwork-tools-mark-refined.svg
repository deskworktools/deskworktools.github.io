<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .navy-fill { fill: #0B132A; }
      .blue-fill { fill: #0066FF; }
      .white-fill { fill: #FFFFFF; }
    </style>
  </defs>

  <g id="brand-mark">
    <!-- Stand Neck -->
    <rect x="238" y="360" width="36" height="52" rx="6" class="navy-fill" />
    <!-- Stand Base -->
    <path d="M 160 412 L 194 390 L 318 390 L 352 412 Z" class="navy-fill" />

    <!-- Monitor Frame -->
    <rect x="46" y="80" width="420" height="280" rx="24" class="navy-fill" />
    <!-- Screen -->
    <rect x="70" y="104" width="372" height="232" rx="12" class="white-fill" />

    <!-- DT Monogram -->
    
    <g transform="translate(256, 230) skewX(-11)">
      <!-- Letter 'D' in Navy -->
      <path d="
        M -50 -32
        L -20 -32
        C -2 -32, 8 -18, 8 0
        C 8 18, -2 32, -20 32
        L -50 32
        Z
        M -36 -19
        L -20 -19
        C -8 -19, -5 -9, -5 0
        C -5 9, -8 19, -20 19
        L -36 19
        Z
      " fill="#0B132A" fill-rule="evenodd" />

      <!-- Letter 'T' in Electric Blue -->
      <path d="
        M -2 -32
        L 48 -32
        L 48 -19
        L 29.5 -19
        L 29.5 32
        L 16.5 32
        L 16.5 -19
        L -2 -19
        Z
      " fill="#0066FF" />
    </g>
  
  </g>
</svg>